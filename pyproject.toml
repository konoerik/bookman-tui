[project]
name = "bookman-tui"
version = "1.0.0"
description = "Textual terminal front end for the bookman ebook library."
readme = "README.md"
authors = [
    { name = "Erikton Konomi", email = "konoerik@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["ebook", "library", "tui", "textual", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "bookman @ git+https://github.com/konoerik/bookman.git@v1.3.0",
    "textual>=8.2.8",
    "textual-image>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/konoerik/bookman-tui"
Repository = "https://github.com/konoerik/bookman-tui"
Issues = "https://github.com/konoerik/bookman-tui/issues"

[project.scripts]
bookman-tui = "bookman_tui:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
filterwarnings = [
    # textual-image 0.12 (the last release for Python < 3.12) calls a Pillow
    # API deprecated for Pillow 14; harmless until then.
    "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
]
asyncio_mode = "auto"
