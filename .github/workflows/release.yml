name: Release

# Tag a commit on main as v<version> and push the tag:
#
#   git tag v2.0.1 && git push origin v2.0.1
#
# This re-runs the tests on the tagged commit, builds the sdist and wheel
# with uv, smoke-tests the wheel, publishes both to PyPI, then publishes a
# GitHub Release carrying them. PyPI goes first: a version uploaded there can
# never be replaced, so if the upload fails nothing else is released.
#
# PyPI uses trusted publishing (no token): the `bookmgr-tui` project trusts
# this repository's `release.yml` workflow in the `pypi` environment.
#
# The tag must match pyproject.toml's version; the build fails otherwise.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python 3.10
      - name: Test
        run: uv run pytest

  build:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches pyproject version
        id: version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.10 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/bookmgr-tui --help
          /tmp/smoke/bin/python -c "from bookmgr_tui.app import BookmgrApp"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bookmgr-tui/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: false
          body: |
            Install from PyPI:

                uv tool install "bookmgr-tui==${{ needs.build.outputs.version }}"
